<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lutru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main id="main-id">
    <section class="d-flex flex-column justify-content-center align-items-center min-vh-100 text-center fs-4" id="login-m">

      <div class="login-header mb-4">
        <a href="index.html" class="nav-link d-flex align-items-center justify-content-center gap-2">
          <img src="logo.png" alt="Logo">
          Lutru
        </a>
      </div>

      <div class="le-login-box">

        <h1>Płatność</h1>

        <form class="fs-4">

            <div class="mb-3 text-start">
                <label class="form-label">Wybierz plan</label>
                <select class="form-select">
                    <option>Pisklak - 35zł/rok</option>
                    <option>Pingwin 120zł/rok</option>
                    <option>Król 500zł/rok</option>
                </select>
            </div>

            <!-- ✔ METODA PŁATNOŚCI -->
            <div class="mb-3 text-start">
                <label class="form-label">Metoda płatności</label>
                <select class="form-select">
                    <option>BLIK</option>
                    <option>Karta płatnicza (Stripe/PayPal)</option>
                    <option>Przelew bankowy</option>
                </select>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label">E-mail</label>
                <input class="form-control" type="email">
            </div>

            <div class="mb-3 text-start">
                <label class="form-label">Numer telefonu (opcjonalnie)</label>
                <input class="form-control" type="tel">
            </div>

            <div class="mb-3 text-start">
                <label class="form-label">Kraj</label>
                <input class="form-control" type="text">
            </div>

            <div class="form-check text-start mb-3">
                <input class="form-check-input" type="checkbox">
                <label class="form-check-label">
                    Akceptuję regulamin
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">
                Przejdź dalej
            </button>

        </form>

        <p class="mt-3 text-center">
            Płatność zostanie zrealizowana przez zewnętrznego operatora.
        </p>

        <p class="text-center">
            <a href="index.html">Powrót</a>
        </p>

      </div>

    </section>
  </main>
</body>
</html>
